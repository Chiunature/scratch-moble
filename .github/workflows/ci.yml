name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Build and sync editor web bundle
        run: yarn editor:web

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Android production JS bundle
        run: yarn bundle:android
